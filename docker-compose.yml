version: "3.8"

services:
  bot:
    build: .
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bob
      POSTGRES_PASSWORD: bobpass
      POSTGRES_DB: bob_community
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bob"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
